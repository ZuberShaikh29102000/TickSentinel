[project]
name = "ticksentinel"
version = "0.1.0"
description = "Market data integrity monitor: detects broken crypto feeds and diagnoses root causes with AI agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "websockets>=14.0",
    "httpx>=0.27",
    "asyncpg>=0.30",
    "pydantic-settings>=2.4",
    "orjson>=3.10",
    "sortedcontainers>=2.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

# hatchling until Phase 6, when the C++ fast path needs scikit-build-core.
# Keeping it now would force a C++ toolchain on anyone installing Phase 1-5.
[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticksentinel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Live tests hit real exchanges; opt in with `pytest -m live`.
addopts = "-m 'not live'"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs local Postgres (docker compose up -d postgres)",
    "live: connects to the real exchanges (network required, ~1-2 min)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["sortedcontainers.*", "asyncpg.*"]
ignore_missing_imports = true
